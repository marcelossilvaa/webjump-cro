  (function () {
    if (window.abTestBestSeller) {
      return;
    }
    window.abTestBestSeller = "true";
    gtmDataObject = window.gtmDataObject || [];
    gtmDataObject.push({
      event: "adobe_target",
      event_raised_by: "adobe target",
      experiment_id: "${campaign.id}",
      experiment_type: "AB",
      experiment_name: "${campaign.name}",
      experiment_variant_id: "${campaign.recipe.id}",
      experiment_variant: "${campaign.recipe.name}",
    });

    var bestsellersSKUs = [
      {
        technology: "Original",
        category: "Espresso",
        nome: "Volluto",
        SKU: "7812.10",
      },
      {
        technology: "Original",

        nome: "Ristretto Italiano",

      {

      {

        SKU: "7755.10",
      },
      {
        technology: "Original",
        category: "Master Origin",
        nome: "Colombia",
        SKU: "7720.10",
      },
      {
        technology: "Original",
        category: "Seleções Especiais",
        nome: "Kit Variedades - 50 Cafés",
        SKU: "114207",
      },
      {
        technology: "Original",
        category: "Sugestão de Presentes",
        nome: "NOMAD Medium & Chocolate Gift Pack",
        SKU: "128061",
      },
      {
        technology: "Vertuo",
        category: "Espresso",
        nome: "Voltesso",
        SKU: "7047.80",
      },
      {
        technology: "Vertuo",
        category: "Ristretto",
        nome: "Ristretto Intenso",
        SKU: "7011.80",
      },
      {
        technology: "Vertuo",
        category: "Double Espresso",
        nome: "Double Espresso Dolce",
        SKU: "7044.80",
      },
      {
        technology: "Vertuo",
        category: "Barista Creations",
        nome: "Bianco Doppio",
        SKU: "7016.80",
      },
      {
        technology: "Vertuo",
        category: "Gran Lungo",
        nome: "Fortado",
        SKU: "7059.80",
      },
      {
        technology: "Vertuo",
        category: "Signature",
        nome: "Intenso",
        SKU: "7042.80",
      },
      {
        technology: "Vertuo",
        category: "Master Origin",
        nome: "Colombia",
        SKU: "7028.80",
      },
      {
        technology: "Vertuo",

        SKU: "7001.80",
      },
      {
        technology: "Vertuo",

        nome: "Brazil Favourites Kit - 30 Vertuo Capsules",
        SKU: "142973",
      },
      {
        technology: "Vertuo",
        category: "Seleções Especiais",
        nome: "30 Capsules + Lume Capsule dispenser Gift Pack",
        SKU: "134533",
      },
    ];

    var BESTSELLER_CLASS = "product-bestseller";
    var PRODUCTS_CONTAINER_SELECTOR = "plp-cards-grid";

    // Estilos CSS para a flag diagonal no canto direito
    var styles = document.createElement("style");
    styles.innerHTML = `
          .product-bestseller {
              position: relative;
              overflow: visible;
          }
          
          .product-bestseller::before {
              content: "";
              position: absolute;
              top: 0;
              right: 0;
              width: 0;
              height: 0;
              border-style: solid;
              border-width:0 70px 70px 0;
              border-color: transparent #cbbfb3 transparent transparent;
              z-index: 5;
              border-radius:0px 12px 0px;
          }
          
          .product-bestseller::after {
              content: "";
              position: absolute;
              top: 40px;
              right: 0;
              width: 115px;
              color: white;
              font-size: 10px;
              font-weight: bold;
              text-align: center;
              transform: rotate(45deg) translateX(20%);
              transform-origin: top right;
              z-index: 6;
              text-transform: uppercase;
              font-family: inherit;
              letter-spacing: 0.5px;
              white-space: nowrap;
          }
          
          .bestseller-content {
              position: absolute;
              top: 26px;
              right: -2px;
              width: 70px;
              color: #000;
              font-size: 10px;
              font-weight: bold;
              text-align: center;
              transform: rotate(45deg) translateX(20%);
              transform-origin: top right;
              z-index: 7;
              text-transform: uppercase;
              font-family: inherit;
              letter-spacing: 0.5px;
              white-space: nowrap;
              display: flex;
              flex-direction: column;
              align-items: center;
              line-height: 14px;
              justify-content: center;
          }
  
          .bestseller-content .star {
              margin-bottom: 2px;
              display: flex;
              align-items: center;
              justify-content: center;
          }
      `;

    function needsFlag(header) {
      return header && !header.classList.contains(BESTSELLER_CLASS);
    }

    function applyBestsellerFlags() {
      bestsellersSKUs.forEach(function (product) {
        var productElement = document.querySelector(
          "article[data-product-short-sku='" + product.SKU + "']"
        );

        if (productElement) {
          var header = productElement.querySelector("header");

          if (needsFlag(header)) {
            header.classList.add(BESTSELLER_CLASS);

            var bestsellerContent = document.createElement("div");
            bestsellerContent.className = "bestseller-content";

            var textDiv = document.createElement("div");
            textDiv.className = "text";
            textDiv.innerHTML = "MAIS<br>VENDIDO";
            bestsellerContent.appendChild(textDiv);
            header.appendChild(bestsellerContent);
          }
        }
      });
    }

    function init() {
      if (!document.getElementById("bestseller-styles")) {
        styles.id = "bestseller-styles";
        document.head.appendChild(styles);
      }

      applyBestsellerFlags();

      var productsContainer = document.querySelector(
        PRODUCTS_CONTAINER_SELECTOR
      );

      if (productsContainer) {
        var observer = new MutationObserver(function (mutations) {
          var hasRelevantChanges = mutations.some(function (mutation) {
            var hasNewProducts = Array.from(mutation.addedNodes).some(function (
              node
            ) {
              return (
                node.nodeType === 1 &&
                (node.matches("article[data-product-short-sku]") ||
                  node.querySelector("article[data-product-short-sku]"))
              );
            });
            if (
              mutation.type === "attributes" &&
              mutation.target.matches("article[data-product-short-sku]")
            ) {
              return true;
            }

            return hasNewProducts;
          });

          if (hasRelevantChanges) {
            requestAnimationFrame(applyBestsellerFlags);
          }
        });

        observer.observe(productsContainer, {
          childList: true,
          subtree: true,
          attributes: true,
          attributeFilter: ["data-product-short-sku"],
        });
      } else {
        var bodyObserver = new MutationObserver(function (mutations) {
          var productsContainer = document.querySelector(
            PRODUCTS_CONTAINER_SELECTOR
          );
          if (productsContainer) {
            init();
            bodyObserver.disconnect();
          }
        });

        bodyObserver.observe(document.body, {
          childList: true,
          subtree: true,
        });
      }
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", init);
    } else {
      init();
    }
  })();
</script>
