<script>
  (function () {
    if (window.poppinForYou) {
      return;
    }
    window.poppinForYou = "true";
    gtmDataObject = window.gtmDataObject || [];

      event: "adobe_target",
      event_raised_by: "adobe target",
      experiment_id: "${campaign.id}",
      experiment_type: "AB",
      experiment_name: "${campaign.name}",
      experiment_variant_id: "${campaign.recipe.id}",

    });

            right: 0;
            top: 0;
            color: #000;
            border: 1px solid #AEAEAE;
            border-radius: 30px;
            background: #FFF;
            font-size: 20px;
            font-weight: lighter;
            line-height: 0px;
            padding: 10px 4px;
            position: absolute;
          }
          .forYoulvl1_box_close:before {
            content: "×";

          }
          #for_you_image {
            max-width: 100%;
            max-height: 100%;
            display: block;
            cursor: pointer;
            right: 23px;
            position: fixed;
            bottom: 210px;
            }
          .foryou_container {
            position: fixed;
            right: 0px;
            height: 232px;
            width: 160px;
            overflow: hidden;
            z-index: 2000;

  </div>
  `;
    document.body.insertAdjacentHTML(
      "beforeend",
      '<div id="forYouPoppin"></div>'
    );

    $(".forYoulvl1_box_close").on("click", function () {
      $(".foryou_container").css("display", "none");
