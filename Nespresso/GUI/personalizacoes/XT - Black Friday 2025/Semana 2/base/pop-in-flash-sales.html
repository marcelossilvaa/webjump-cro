<style id="custom-popin-styles">
  #custom-popin {
    cursor: pointer;
    position: fixed;
    bottom: 20px;
    right: 25px;
    background: #bc312c;
    border-radius: 60px;
    display: flex;
    color: #fff;
    align-items: center;
    box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
    padding: 15px 20px;
    z-index: 1001;
    transition: all 0.3s ease;
    max-width: 530px;
    font-family: "NespressoLucas", "Nespresso Lucas", "Lucas", "Trebuchet MS";
  }

  #custom-popin .image {
    width: 70px;
    height: 70px;
    background: white;
    border-radius: 50%;
    overflow: hidden;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-left: 15px;
    flex-shrink: 0;
  }

  #custom-popin .image img {
    width: 85px;
    height: 85px;
  }

  #custom-popin .content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    flex: 1;
    padding-right: 15px;
  }

  #custom-popin .title {
    font-weight: bold;
    font-size: 17px;
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  #custom-popin .desc {
    font-size: 11px;
    line-height: 1.3;
    color: #fff;
    text-align: center;
    font-weight: 400;
  }

  #custom-popin .close {
    position: absolute;
    top: -10px;
    right: -10px;
    background: black;
    color: white;
    border-radius: 50%;
    width: 28px;
    height: 28px;
    text-align: center;
    line-height: 28px;
    cursor: pointer;
    font-size: 18px;
    font-weight: bold;
  }

  /* ---------- MOBILE STYLES ---------- */
  @media screen and (max-width: 768px) {
    #custom-popin {
      left: 10px;
      right: 10px;
      bottom: 90px !important;
      padding: 12px 16px;
      border-radius: 24px;
    }

    #custom-popin .image {
      width: 70px;
      height: 70px;
      margin-left: 10px;
    }

    #custom-popin .image img {
      width: 76px;
      height: 76px;
    }

    #custom-popin .title {
      font-size: 20px;
    }

    #custom-popin .desc {
      font-size: 12px;
    }

    #custom-popin .close {
      top: -8px;
      right: -8px;
      width: 24px;
      height: 24px;
      font-size: 16px;
      line-height: 24px;
    }
  }

  @media screen and (max-width: 480px) {
    #custom-popin {
      flex-direction: row;
      /* mantém layout horizontal */
      align-items: center;
      padding: 12px;
    }

    #custom-popin .image {
      width: 60px;
      height: 60px;
      margin-left: 10px;
    }

    #custom-popin .image img {
      width: 76px;
      height: 76px;
    }

    #custom-popin .title {
      font-size: 20px;
    }

    #custom-popin .desc {
      font-size: 12px;
    }
  }
</style>

<div id="custom-popin" style="display: none">
  <div class="close" onclick="document.getElementById('custom-popin').remove()">
    ×
  </div>
  <div class="content" id="container_redirecionamento">
    <div class="title">OFERTA RELÂMPAGO</div>
    <div class="desc">
      GANHE<span style="font-weight: 700; font-size: 15px"> 40% OFF</span> EM
      KITS SELECIONADOS. <span style="font-weight: 700">CONFIRA!</span>
    </div>
  </div>
  <div class="image">
    <img
      src="https://www.nespresso.com/ecom/medias/sys_master/public/46622037213214/Pop-in.jpg?attachment=true&cimgnr=Ww5oF"
      alt="Imagem porta cápsulas flash sales"
    />
  </div>
</div>

<script>
  (function () {
    const cutoff = new Date("2025-11-30T00:00:00"); // Data limite
    const now = new Date();
    let popinShown = false; // Evita múltiplas exibições
    const STORAGE_KEY = "customPopinClosedAt"; // chave para localStorage
    const DAYS_TO_HIDE = 1;

    // Função para verificar se o popin foi fechado recentemente
    function wasRecentlyClosed() {
      const closedAt = localStorage.getItem(STORAGE_KEY);
      if (!closedAt) return false;
      const closedDate = new Date(closedAt);
      const diffTime = now - closedDate;
      const diffDays = diffTime / (1000 * 60 * 60 * 24);
      return diffDays < DAYS_TO_HIDE;
    }

    function isMobileDevice() {
      const mobileKeywords =
        /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i;
      return mobileKeywords.test(navigator.userAgent);
    }

    function inicializarRedirecionamento() {
      const urlDesktop =
        "https://www.nespresso.com/br/pt/order/capsules/original";
      const urlMobile =
        "https://www.nespresso.com/br/pt/order/capsules/original";

      const elemento = document.getElementById("container_redirecionamento");

      if (!elemento) {
        return;
      }

      elemento.addEventListener("click", function () {
        let urlDestino = isMobileDevice() ? urlMobile : urlDesktop;

        console.log("Redirecionando para: " + urlDestino);
        window.location.href = urlDestino;
      });
    }

    function checkAndShowPopin() {
      const url = window.location.href;
      const hasEmpresas = url.includes("/test-nova-home-page");
      const hasProfessionalSummary = url.includes("/test-nova-home-page");

      if (
        (hasEmpresas || hasProfessionalSummary) &&
        now < cutoff &&
        !popinShown &&
        !wasRecentlyClosed()
      ) {
        const popin = document.getElementById("custom-popin");
        if (popin) {
          popin.style.display = "flex";
          popinShown = true;

          // Ajuste de bottom para mobile no /assinatura-professional#/summary
          if (hasProfessionalSummary && window.innerWidth <= 768) {
            popin.style.bottom = "50px";
          }

          // Adiciona evento de fechar para salvar no localStorage
          const closeBtn = popin.querySelector(".close");
          if (closeBtn) {
            closeBtn.addEventListener("click", () => {
              localStorage.setItem(STORAGE_KEY, new Date().toISOString());
              popin.style.display = "none";
            });
          }
        }
      }
    }

    // Verifica a URL imediatamente (caso já esteja no local correto)
    checkAndShowPopin();

    // Observa mudanças na URL em SPAs usando polling
    let lastUrl = window.location.href;
    setInterval(() => {
      const currentUrl = window.location.href;
      if (currentUrl !== lastUrl) {
        lastUrl = currentUrl;
        checkAndShowPopin();
      }
    }, 300);

    document.addEventListener("DOMContentLoaded", inicializarRedirecionamento);
  })();
</script>
