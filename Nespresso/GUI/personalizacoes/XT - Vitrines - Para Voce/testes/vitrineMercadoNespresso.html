     */
    function getCart() {
      return window.napi.cart().read();
    }

    /**
     * Update cart
     * @returns {Promise<undefined>}
     */
    function updateCart(productSku, quantity) {
      return window.CartManager.updateItem(productSku, quantity);
    }

    /**
     * Get product count in cart
     * @requires getCart
     * @requires getStoreId
     * @returns {Promise<number>}
     */
    function getProductCountInCart(productSku) {
      const storeId = getStoreId();
      return new Promise((resolve, reject) => {
        getCart()
          .then((cartItems) => {
            const targetItem = cartItems.find(({ productId }) => {
              return productId.replace(storeId, "") === productSku;
            });
            resolve((targetItem && targetItem.quantity) || 0);
          })
          .catch(reject);
      });
    }

      setOpen,
      productData,
      productPositionIndex,
      tooltipPosition,
      eventHooks,
    }) => {
      const wrapperRef = useRef();

      const handlePredefinedItemClick = useCallback((quantity) => {
        const productSku = productData?.legacyId;
        getProductCountInCart(productSku).then((currentCount) => {
          updateCart(productSku, currentCount + quantity)
            .then(() => {
              eventHooks?.on_quantity_updated?.(
                productData,
                productPositionIndex
              );
              if (quantity >= 1) {
                eventHooks?.on_basket_add?.(
                  productData?.name,
                  productPositionIndex
                );
              }
            })
            .finally(() => setOpen(false));
        });
      });

      const handleDocumentClick = useCallback(

          if (!productData) return;
          if (!open || wrapperRef.current.base.contains(e.target)) return;
          setOpen(false);
        },
        [open, productData]
      );

      useEffect(() => {
        document.addEventListener("click", handleDocumentClick);
        return () => {
          document.removeEventListener("click", handleDocumentClick);
        };
      }, [open]);

        styled("div")(

            display: block;
            position: absolute;
            width: 13.25rem;
            background-color: #f9f9f9;
            padding: 0.625rem;
            border: 1px solid #d5d5d5;
            border-radius: 2px;
            font-size: .75rem;
            color: #1b1b1b;
            box-shadow: 0 0px 10px rgb(0 0 0 / 5%);
            opacity: ${open ? "1" : "0"};
            pointer-events: ${open ? "auto" : "none"};
            z-index: 1;
            box-shadow: rgb(0 0 0 / 15%) 0px 0px 20px;
            transition: all .1s;
  
            transform:
              translate(calc(40px / 2 - 50%),
              calc(-100% - ${open ? "15px" : "10px"}));
            &::before, &::after {
              content: "";
              position: absolute;
              width: 0;
              height: 0;
              border: 10px solid;
            }
  
            ${(() => {
              if (tooltipPosition === "left") {
                return /* css */ `
                  transform:
                    translate(calc(-100% - ${open ? "15px" : "10px"}),
                    calc(40px / 2 - 50%));
                  &::before, &::after {
                    border-right-width: 0;
                  }
                  &::before {
                    border-color: #d5d5d5;
                    border-top-color: transparent;
                    border-bottom-color: transparent;
                    top: calc(50% - 10px);
                    right: -11px;
                  }
                  &::after {
                    border-color: #f9f9f9;
                    border-top-color: transparent;
                    border-bottom-color: transparent;
                    top: calc(50% - 10px);
                    right: -10px;
                  }
                `;
              } else {
                return /* css */ `
                  &::before, &::after {
                    border-bottom-width: 0;
                  }
                  &::before {
                    border-color: #d5d5d5;
                    border-right-color: transparent;
                    border-left-color: transparent;
                    left: calc(50% - 10px);
                    bottom: -11px;
                  }
                  &::after {
                    border-color: #f9f9f9;
                    border-right-color: transparent;
                    border-left-color: transparent;
                    left: calc(50% - 10px);
                    bottom: -10px;
                  }
                `;
              }
            })()}
        `

                        slidesPerView: 4,
                        pagination: {
                          type: "bullets",
                          clickable: true,
                        },
                      },
                    }}
                    onSwiper=${handleOnSwiper}
                    onAfterInit=${handleOnAfterInit}
                    onSliderFirstMove=${handleSliderFirstMove}
                    onSlideChangeTransitionEnd=${handleSlideChangeTransitionEnd}
                    onBreakpoint=${handleOnBreakpoint}
                    onPaginationRender=${handleOnPaginationRender}
                  >
                    ${productList.map(
                      (productItem, i) => html`
                      <${SwiperSlide}>
                        <${StyledProductCrossSellCard.current}
                          ...${productItem}
                          position_index=${i + 1}
                          is_visible=${slideVisibilities[i]}
                          is_mobile=${isMobile}
                        />
                      </SwiperSlide>
                    `
                    )}
                  </StyledSwiper>
                  <${
                    NavigationPrev.current
                  } className=${"swiper-button-prev"} onClick=${handlePrev} />
                  <${
                    NavigationNext.current
                  } className=${"swiper-button-next"} onClick=${handleNext} />
                </div>
                <div>
                <!-- CTAs -->
                ${
                  !!primaryCta &&
                  html`
                  <${ButtonContainer.current}>
                    <!-- Primary CTA -->
                    <${PrimaryCTA.current}
                      label=${primaryCta.label}
                      link_title=${primaryCta.link_title}
                      href=${primaryCta.href}
                      event_hooks=${{
                        on_click: eventHooks?.on_primary_cta_click,
                      }}
                    />
                    <!-- Primary CTA -->
                  </ButtonContainer>
                `
                }
                <!-- CTAs -->
                </div>
              </Inner>
            </div>
          </Wrapper>
        `;
    };

    // main

    const marketCode = await getMarket();
    const marketCodeUpperCase = marketCode.toUpperCase();
    const isOriginal = location.href.indexOf("original") > -1;

    // tracking - edit these
    const CAMPAIGN_NAME = "EngageProductReco";
    const CAMPAIGN_DATE = "2024_03";
    const PAGE_NAME = "Capsules";
    const TECH_NAME = isOriginal ? "Original" : "Vertuo";

    // tracking - do not edit these
    const CAMPAIGN_ID = `${marketCodeUpperCase}_${CAMPAIGN_DATE}_${CAMPAIGN_NAME}_${PAGE_NAME}_${TECH_NAME}PLP_ProductCrossSell`;
    const INTERNAL_PROMOTION_PRODUCTS_CROSS_SELL = {
      id: CAMPAIGN_ID,
      name: CAMPAIGN_NAME,
      creative: "before_hero_banner",
      position: "top",
    };
    const EVENT_LABEL_PREFIX = `${CAMPAIGN_NAME} Product Rec - ${PAGE_NAME} - ${TECH_NAME} PLP`;

    const productSkuList =
      marketCode === "au"
        ? isOriginal
          ? // Original AU
            [
              "5048-2", // Descaling Kit
              "101852/POST", // AusPost Recycling
              "122779", // Monin Syrups
              "132077", // Nomad Terracotta Travel Mug
              "128557", // Recycling Bin
            ]
          : // Vertuo AU
            [
              "5048-2", // Descaling Kit
              "101852/POST", // AusPost Recycling
              "122779", // Monin Syrups
              "132077", // Nomad Terracotta Travel Mug
              "128557", // Recycling Bin
            ]
        : isOriginal
        ? // Original NZ
          [
            "5000-2", // Descaling Kit
            "90643", // Recyclig Post Bag
            "101852", // Recycling drop off bag
            "122779", // Monin Syrups
            "132077", // Nomad Terracotta Travel Mug
          ]
        : // Vertuo NZ
          [
            "5000-2", // Descaling Kit
            "SEALNZP1", // Doorstep Collection Recycling Bag
            "101852", // Recycling drop off bag
            "122779", // Monin Syrups
            "132077", // Nomad Terracotta Travel Mug
          ];

    const productList = productSkuList.map((productSku) => ({
      product_sku: productSku,
      ribbon: null,
      price_adjust: null,
      event_hooks: {
        on_pdp_link_click: (productName, positionIndex) => {
          if (!productName) return;
          trackGAInternalPromotionClick(INTERNAL_PROMOTION_PRODUCTS_CROSS_SELL);
          trackGAEvent({
            eventLabel: `${EVENT_LABEL_PREFIX} - PDP Link - ${positionIndex} - ${productName}`,
          });
          const newProductName = productName.replace(/[^0-9a-z]/gi, "");
          trackGAInternalPromotionClick({
            id: `${CAMPAIGN_ID}_${positionIndex}_${newProductName}`,
            name: CAMPAIGN_NAME,
            creative: "before_hero_banner",
            position: "top",
          });
        },
        on_basket_add: (productName, positionIndex) => {
          if (!productName) return;
          trackGAEvent({
            eventCategory: "Ecommerce",
            eventAction: "Add to Cart",
            eventLabel: `${EVENT_LABEL_PREFIX} - Cart Add - ${positionIndex} - ${productName}`,
          });
        },
        on_product_impression: (productName, positionIndex) => {
          if (!productName) return;
          const newProductName = productName.replace(/[^0-9a-z]/gi, "");
          trackGAInternalPromotionImpression({
            id: `${CAMPAIGN_ID}_${positionIndex}_${newProductName}`,
            name: CAMPAIGN_NAME,
            creative: "before_hero_banner",
            position: "top",
          });
          trackGAEvent({
            eventLabel: `${EVENT_LABEL_PREFIX} - Product Impression - ${positionIndex} - ${productName}`,
          });
        },
      },
    }));

    console.log("Product list:");
    console.log(productList);

    insertComponent({
      component: ProductCrossSell,
      config: {
        content: {
          align: "center",
          heading: "Our Accessory Picks",
          description: null,
        },
        product_list: productList,
        event_hooks: {
          on_impression: () => {
            trackGAInternalPromotionImpression(
              INTERNAL_PROMOTION_PRODUCTS_CROSS_SELL
            );
            trackGAEvent({
              eventAction: "Display",
              eventLabel: `${EVENT_LABEL_PREFIX} - Impression`,
            });
          },
          on_navigation_next_click: () => {
            trackGAEvent({
              eventLabel: `${EVENT_LABEL_PREFIX} - Right Arrow`,
            });
          },
          on_navigation_prev_click: () => {
            trackGAEvent({
              eventLabel: `${EVENT_LABEL_PREFIX} - Left Arrow`,
            });
          },
          on_slider_first_move: () => {
            trackGAEvent({
              eventAction: "Swipe",
              eventLabel: `${EVENT_LABEL_PREFIX} - Carousel Swipe`,
            });
          },
          on_pagination_dot_click: () => {
            trackGAEvent({
              eventLabel: `${EVENT_LABEL_PREFIX} - Carousel Pagination Dot`,
            });
          },
          on_primary_cta_click: () => {
            trackGAEvent({
              eventLabel: `${EVENT_LABEL_PREFIX} - Primary CTA`,
            });
          },
        },
      },
      position: "afterbegin",
      element: "#anz-shared-capsules-plp-products-cross-sell",
    });
  })();
</script>
