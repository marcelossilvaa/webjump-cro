<script>
  let divAppend = document.querySelector("#block-8831949362677");
  let buscaDivAppend = setInterval(function () {
    if (divAppend) {
      clearInterval(buscaDivAppend);
      let linksCashback = document.querySelectorAll(
        "#container-ofertasCompreGanhe a[class*='card-link']"
      );
      if (linksCashback) {
        linksCashback.forEach((element) => {
          element.addEventListener("click", () => {
            let currentCardLabel = "";
            switch (element.classList[0]) {
              case "card-link-1":
                currentCardLabel = "card nivel 1";
                break;
              case "card-link-2":
                currentCardLabel = "card nivel 2";
                break;
              case "card-link-3":
                currentCardLabel = "card nivel 3";
                break;
              case "card-link-4":
                currentCardLabel = "card nivel 4";
                break;
              case "card-link-5":
                currentCardLabel = "card nivel 5";
                break;
              case "card-link-6":
                currentCardLabel = "card nivel 6";
                break;
            }
            sendGAData(currentCardLabel);
          });
        });
      }
    }
  }, 500);
  function sendGAData(label) {
    window.gtmDataObject = window.gtmDataObject || [];
    gtmDataObject.push({
      event: "local_event",
      event_raised_by: "br",
      local_event_category: "user engagement",
      local_event_action: "click",
      local_event_label: "card click - cashback campaign - " + label,
    });
  }
</script>
