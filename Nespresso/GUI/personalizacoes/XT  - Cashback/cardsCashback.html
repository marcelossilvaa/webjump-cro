<style>
  #container-ofertasCompreGanhe {
    font-family: NespressoLucas;
    background-color: #fff;
    text-align: center;
    padding: 20px 0;
  }
  .container-ofertasCompreGanhe__title {
    font-size: 24px;
    text-transform: uppercase;
    font-weight: 600;
    line-height: 1.3em;
    padding: 0 45px;
  }
  #cardProducts {
    display: flex;
    width: 100%;
    height: auto;
    gap: 60px;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 20px;
  }

  @media screen and (max-width: 767px) {
    #cardProducts {
      gap: 15px;
    }
  }

  #cardProducts .cardProducts_item {
    border: 1px solid #00000015;
    box-shadow: 0px 1px 20px 0px #00000015;
    width: 170px;
    height: 300px;
    padding: 20px 10px 20px 10px;
    border-radius: 10px;
    position: relative;
  }
  #cardProducts .cardProducts_item .cardProducts_item__image {
    width: auto;
    height: 110px;
    margin: 10px;
  }
  #cardProducts .cardProducts_item .cardProducts_item__info {
    width: 100%;
    height: 50%;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  #cardProducts .cardProducts_item .cardProducts_item__info_title {
    font-size: 20px;
    font-weight: 700;
  }
  #cardProducts .cardProducts_item .cardProducts_item__info_offer {
    text-transform: uppercase;
    color: #257a57;
    font-weight: 600;
  }

  #cardProducts .offer-tag {
    font-size: 10px;
    background-color: rgba(144, 79, 149, 0.674);
    width: 100px;
    font-weight: 500;
    position: absolute;
    padding: 2px;
    top: 10px;
    left: 0;
  }
</style>
