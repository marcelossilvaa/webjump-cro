  let divAppend = document.querySelector("#block-8831949362677");
  let buscaDivAppend = setInterval(function () {
    if (divAppend) {
      clearInterval(buscaDivAppend);
      divAppend.innerHTML = sectionCashback;
      const parentElement = document.getElementById("cardProducts");
      let componenteAdicional = `<div class="cardProducts_item"><a class="card-link-6" href="https://www.nespresso.com/br/pt/order/capsules/original" style="color:#000"><span class="offer-tag">COMPRE E GANHE</span><img src="https://www.nespresso.com/ecom/medias/sys_master/public/33542872006686/Sticky-Banner-400x400-nivel6.png?" alt="Imagem de tag de desconto de R$200 colorida" class="cardProducts_item__image"/><div class="cardProducts_item__info"><div class="cardProducts_item__info_title">R$ 200 <br/>de crédito</div><div class="cardProducts_item__info_offer">na compra de 300 cápsulas</div></div></a></div>`;
      parentElement.insertAdjacentHTML("afterbegin", componenteAdicional);
      let linksCashback = document.querySelectorAll(
        "#container-ofertasCompreGanhe a[class*='card-link']"
      );
      if (linksCashback) {
        linksCashback.forEach((element) => {
          element.addEventListener("click", () => {
            let currentCardLabel = "";
            switch (element.classList[0]) {
              case "card-link-1":
                currentCardLabel = "card nivel 1";
                break;
              case "card-link-2":
                currentCardLabel = "card nivel 2";
                break;
              case "card-link-3":
                currentCardLabel = "card nivel 3";
                break;
              case "card-link-4":
                currentCardLabel = "card nivel 4";
                break;
              case "card-link-5":
                currentCardLabel = "card nivel 5";
                break;
              case "card-link-6":
                currentCardLabel = "card nivel 6";
                break;
            }
            sendGAData(currentCardLabel);
          });
        });
      }
    }
  }, 500);
  function sendGAData(label) {
    window.gtmDataObject = window.gtmDataObject || [];
    gtmDataObject.push({
      event: "local_event",
      event_raised_by: "br",
      local_event_category: "user engagement",
      local_event_action: "click",
      local_event_label: "card click - cashback campaign - " + label,
    });
  }
</script>
