<script>
  (function () {
    // PDP: /br/{pt|en}/order/capsules/{original|vertuo}/{slug-produto}
    // PT ex.: .../capsulas-cafe-ispirazione-napoli
    // EN ex.: .../ispirazione-napoli-coffee-capsule (capsule no slug, nao como segmento)
    let regexPDPs =
      /\/br\/(pt|en)\/order\/capsules\/(original|vertuo)\/.+/i;
    let regexPLPs = /\/br\/(pt|en)\/order\/capsules\/(original|vertuo)$/;
    let pagePathAtual = window.location.pathname;
    let isEnglish = pagePathAtual.indexOf("/br/en/") !== -1;

    function getCopy() {
      if (isEnglish) {
        return {
          limitedEdition: "limited edition",
          plpSubscriptionSuffix: " w/ Subscription",
          pedidoAutomaticoUrl:
            "https://www.nespresso.com/br/en/pedido-automatico",
          standingOrdersHref:
            "/br/en/myaccount/standing-orders#/orders/list",
          subscriptionTitle:
            "Save with Subscription: 10% off and free shipping on orders of 30+ capsules.",
          noSubscriptionHeading:
            'Don\'t have a Subscription?<a href="https://www.nespresso.com/br/en/pedido-automatico" target="_blank">Discover the benefits</a>',
          subscribeAndPay: "Subscribe and pay:",
          perBoxWithSubscription: "per box with Subscription",
          footnoteCapsules: "* From 30 capsules",
          freeShipping: "Free Shipping*",
          zeroMonthlyFee: "No monthly fee",
          ctaSubscribeNow: "SUBSCRIBE NOW",
          pillCta: "SUBSCRIBE NOW",
          pillCtaAria: "Subscribe now",
          pillPriceAria: "Price with subscription",
          pillPriceCaption: "per box with Subscription",
          pillDiscountAria: "Discount",
          pillZeroMonthly: "No monthly fee",
          pillSub: "From 30 capsules, get",
        };
      }
      return {
        limitedEdition: "edição limitada",
        plpSubscriptionSuffix: " na Assinatura",
        pedidoAutomaticoUrl:
          "https://www.nespresso.com/br/pt/pedido-automatico",
        standingOrdersHref:
          "/br/pt/myaccount/standing-orders#/orders/list",
        subscriptionTitle:
          "Economize com a Assinatura: 10% de desconto e frete grátis para pedidos de 30+ cápsulas.",
        noSubscriptionHeading:
          'Não tem Assinatura?<a href="https://www.nespresso.com/br/pt/pedido-automatico" target="_blank">Conheça os benefícios</a>',
        subscribeAndPay: "Assine e pague:",
        perBoxWithSubscription: "por caixa com Assinatura",
        footnoteCapsules: "* A partir de 30 cápsulas",
        freeShipping: "Frete Grátis*",
        zeroMonthlyFee: "Zero mensalidade",
        ctaSubscribeNow: "ASSINE AGORA",
        pillCta: "ASSINE AGORA",
        pillCtaAria: "Assine agora",
        pillPriceAria: "Preço com assinatura",
        pillPriceCaption: "por caixa com Assinatura",
        pillDiscountAria: "Desconto",
        pillZeroMonthly: "Zero mensalidade",
        pillSub: "A partir de 30 cápsulas, garanta",
      };
    }

    let copy = getCopy();

    let isProcessingVariantC = false;
    let debounceTimerVariantC = null;
    let primePdpVariantCInitialized = false;

    const STYLE_ID_VARIANT_C = "at-nespresso-prime-pdp-abc-c-style";
    const ROOT_SELECTOR_VARIANT_C = ".primePDP";
    const APPLIED_ATTR_VARIANT_C = "data-at-prime-pdp-abc";
    const APPLIED_VALUE_VARIANT_C = "C";

    function debounceVariantC(fn, waitMs) {
      if (debounceTimerVariantC) {
        clearTimeout(debounceTimerVariantC);
      }
      debounceTimerVariantC = setTimeout(fn, waitMs);
    }

    function safeTextVariantC(el) {
      return el && el.textContent ? el.textContent.trim() : "";
    }

    function injectVariantCStyles() {
      if (document.getElementById(STYLE_ID_VARIANT_C)) return;

      var F =
        "font-family: NespressoLucas, Helvetica, Arial, sans-serif !important;";
      var S = "box-shadow: initial !important;";
      var R =
        ROOT_SELECTOR_VARIANT_C +
        '[data-at-prime-pdp-abc="C"]';

      const style = document.createElement("style");
      style.id = STYLE_ID_VARIANT_C;
      style.textContent =
        R + " { position: relative !important; }" +
        R + " .primeDescontoProdutoContainer { margin-bottom: 10px !important; }" +
        R +
        " .primeDescontoProdutoContainer > a[href]:not(.at-prime-pill) { display: none !important; }" +
        R +
        " .at-prime-pill { position: relative !important; box-sizing: border-box !important; display: flex !important; align-items: center !important; justify-content: space-between !important; gap: 10px !important; width: 100% !important; height: 76px !important; background: #FFFFFF !important; border: 1px solid #86724E !important; border-radius: 60px !important; padding: 0 18px !important; margin-bottom: 14px !important; text-decoration: none !important; color: inherit !important; " +
        F +
        " " +
        S +
        " }" +
        R +
        " .at-prime-pill-main { display: flex !important; align-items: center !important; justify-content: space-between !important; width: 100% !important; gap: 10px !important; " +
        F +
        " }" +
        R +
        " .at-prime-cta { box-sizing: border-box !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; width: 166px !important; height: 48px !important; background: #000000 !important; border: 1px solid #86724E !important; border-radius: 60px !important; flex: 0 0 auto !important; " +
        F +
        " " +
        S +
        " }" +
        R +
        " .at-prime-cta span { " +
        F +
        " font-weight: 400 !important; font-size: 18px !important; line-height: 18px !important; color: #FFFFFF !important; }" +
        R +
        " .at-prime-price { display: flex !important; flex-direction: column !important; align-items: center !important; justify-content: center !important; flex: 1 1 auto !important; min-width: 0 !important; " +
        F +
        " }" +
        R +
        " .at-prime-price-amount { " +
        F +
        " font-weight: 700 !important; font-size: 22px !important; line-height: 18px !important; color: #313030 !important; white-space: nowrap !important; }" +
        R +
        " .at-prime-price-caption { " +
        F +
        " font-weight: 700 !important; font-size: 10px !important; line-height: 18px !important; color: #313030 !important; white-space: nowrap !important; }" +
        R +
        " .at-prime-flag { box-sizing: border-box !important; display: inline-flex !important; align-items: center !important; justify-content: center !important; width: 36px !important; height: 22px !important; background: #257A57 !important; border-radius: 20px !important; flex: 0 0 auto !important; " +
        F +
        " " +
        S +
        " }" +
        R +
        " .at-prime-flag span { " +
        F +
        " font-weight: 800 !important; font-size: 10px !important; line-height: 18px !important; color: #FFFFFF !important; }" +
        R +
        " .at-prime-zero-inline { position: absolute !important; left: 40px !important; bottom: -9px !important; display: inline-flex !important; align-items: center !important; background: #FFFFFF !important; border-radius: 6px !important; padding: 0 6px !important; " +
        F +
        " font-weight: 700 !important; font-size: 10.5px !important; line-height: 17px !important; color: #86724E !important; " +
        S +
        " }" +
        R +
        " .at-prime-zero-inline .at-prime-zero-badge { color: #86724E !important; }" +
        R +
        " .at-prime-sub { " +
        F +
        " font-weight: 400 !important; font-size: 10px !important; line-height: 18px !important; color: #17171A !important; text-align: center !important; margin-top: 6px !important; " +
        S +
        " }" +
        R +
        " .beneficiosPrime { display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: center !important; gap: 30px !important; margin-top: -5px !important; padding: 0px !important; " +
        S +
        " " +
        F +
        " }" +
        R +
        " .beneficiosPrime .containerBeneficioPrime { display: flex !important; flex-direction: row !important; align-items: center !important; justify-content: center !important; gap: 6px !important; " +
        F +
        " " +
        S +
        " }" +
        R +
        " .beneficiosPrime .containerBeneficioPrime:last-child { display: none !important; }" +
        R +
        " .beneficiosPrime nb-icon { width: 20px !important; height: 20px !important; flex: 0 0 20px !important; }" +
        R +
        " .beneficiosPrime svg { width: 20px !important; height: 20px !important; min-width: 20px !important; min-height: 20px !important; color: #17171A !important; " +
        S +
        " }" +
        R +
        " .beneficiosPrime p { " +
        F +
        " font-weight: 700 !important; font-size: 11px !important; line-height: 18px !important; color: #17171A !important; text-align: left !important; margin: 0 !important; white-space: nowrap !important; }" +
        R +
        " .beneficiosPrime .containerBeneficioPrime span { display: none !important; }" +
        R +
        " .signUpPrime { display: none !important; }" +
        R +
        " .observacaoPrime { display: none !important; }" +
        "@media (max-width: 420px) {" +
        R +
        " .at-prime-pill { padding: 0 12px !important; }" +
        R +
        " .at-prime-pill-main { gap: 8px !important; }" +
        R +
        " .at-prime-cta { width: 42% !important; padding: 0 10px !important; }" +
        R +
        " .at-prime-cta span { font-size: 15px !important; }" +
        R +
        " .at-prime-price-amount { font-size: 20px !important; }" +
        R +
        " .at-prime-price-caption { font-size: 9px !important; }" +
        R +
        " .at-prime-flag { width: 34px !important; }" +
        "}";

      document.head.appendChild(style);
    }

    function readPrimeDataVariantC(root) {
      const data = {
        href: "",
        title: "",
        price: "",
        flag: "",
      };

      if (!root) return data;

      const linkOld = root.querySelector(
        ".primeDescontoProdutoContainer > a[href]",
      );
      if (linkOld) {
        data.href = linkOld.getAttribute("href") || "";
        data.title = linkOld.getAttribute("title") || "";
      }

      const priceEl = root.querySelector(".precoCaixaPrime");
      data.price = safeTextVariantC(priceEl);

      const flagEl = root.querySelector(".flagDescontoPDP");
      data.flag = safeTextVariantC(flagEl);

      return data;
    }

    function buildHTMLVariantC(data) {
      const href = data && data.href ? data.href : "#";
      const title = data && data.title ? data.title : "";
      const price = data && data.price ? data.price : "R$ 0,00";
      const flag = data && data.flag ? data.flag : "-10%";

      return (
        '<a class="at-prime-pill" href="' +
        href +
        '" title="' +
        title +
        '">' +
        '<span class="at-prime-pill-main">' +
        '<span class="at-prime-cta" role="button" aria-label="' +
        copy.pillCtaAria +
        '"><span>' +
        copy.pillCta +
        "</span></span>" +
        '<span class="at-prime-price" aria-label="' +
        copy.pillPriceAria +
        '">' +
        '<span class="at-prime-price-amount">' +
        price +
        "</span>" +
        '<span class="at-prime-price-caption">' +
        copy.pillPriceCaption +
        "</span>" +
        "</span>" +
        '<span class="at-prime-flag" aria-label="' +
        copy.pillDiscountAria +
        '"><span>' +
        flag +
        "</span></span>" +
        "</span>" +
        '<span class="at-prime-zero-inline"><span class="at-prime-zero-badge">' +
        copy.pillZeroMonthly +
        "</span></span>" +
        "</a>" +
        '<div class="at-prime-sub">' +
        copy.pillSub +
        "</div>"
      );
    }

    function getOldPrimeLinkVariantC(container) {
      if (!container) return null;

      const children = container.children ? Array.from(container.children) : [];
      for (let i = 0; i < children.length; i++) {
        const el = children[i];
        if (!el || el.nodeType !== 1) continue;
        if (el.tagName === "A" && el.querySelector && el.querySelector(".descontoPDP")) {
          return el;
        }
      }

      return null;
    }

    function applyVariantC() {
      const root = document.querySelector(ROOT_SELECTOR_VARIANT_C);
      if (!root) return;

      if (root.getAttribute(APPLIED_ATTR_VARIANT_C) === APPLIED_VALUE_VARIANT_C) {
        return;
      }

      const data = readPrimeDataVariantC(root);
      if (!data || !data.href) return;
      if (!data.price) return;

      root.setAttribute(APPLIED_ATTR_VARIANT_C, APPLIED_VALUE_VARIANT_C);
      injectVariantCStyles();

      const container = root.querySelector(".primeDescontoProdutoContainer");
      if (!container) return;

      const oldLink = getOldPrimeLinkVariantC(container);
      if (oldLink && oldLink.parentNode) {
        oldLink.parentNode.removeChild(oldLink);
      }

      if (!container.querySelector(".at-prime-pill")) {
        container.insertAdjacentHTML("beforeend", buildHTMLVariantC(data));
      }
    }

    function runVariantC() {
      if (isProcessingVariantC) return;
      isProcessingVariantC = true;
      try {
        applyVariantC();
      } finally {
        isProcessingVariantC = false;
      }
    }

    function initPrimePdpVariantC() {
      if (primePdpVariantCInitialized) return;
      primePdpVariantCInitialized = true;

      debounceVariantC(runVariantC, 0);

      if (!window._atNespressoPrimePdpObserverC) {
        let localTimer = null;
        const observer = new MutationObserver(function () {
          if (localTimer) clearTimeout(localTimer);
          localTimer = setTimeout(function () {
            debounceVariantC(runVariantC, 0);
          }, 150);
        });
        observer.observe(document.body, { childList: true, subtree: true });
        window._atNespressoPrimePdpObserverC = observer;
      }
    }

    if (!pagePathAtual.includes("checkout")) {
      if (regexPLPs.test(pagePathAtual)) {
        let produtosPLPAindaNaoAjustados = document.querySelectorAll(
          "plp-cards-grid article[data-product-short-sku]:not(article[aria-label*='Kit'],article[aria-label*='KIT'],:has(footer.primeAB)",
        );
        setInterval(function () {
          produtosPLPAindaNaoAjustados = document.querySelectorAll(
            "plp-cards-grid article[data-product-short-sku]:not(article[aria-label*='Kit'],article[aria-label*='KIT'],:has(footer.primeAB)",
          );
          if (produtosPLPAindaNaoAjustados.length > 0) {
            produtosPLPAindaNaoAjustados = Array.from(
              produtosPLPAindaNaoAjustados,
            );
            produtosPLPAindaNaoAjustados = produtosPLPAindaNaoAjustados.filter(
              function (produto) {
                let tagsCard = produto.querySelectorAll(
                  "header[class*='tags'] span",
                );
                let isAbleToAdjust = true;
                if (tagsCard) {
                  tagsCard.forEach(function (tagText) {
                    if (
                      tagText.innerText.toLowerCase() == copy.limitedEdition
                    ) {
                      isAbleToAdjust = false;
                      produto.querySelector("footer").classList.add("primeAB");
                    }
                  });
                }
                return isAbleToAdjust;
              },
            );
            precoPrimePLP(produtosPLPAindaNaoAjustados);
          }
        }, 2000);
        function precoPrimePLP(produtos) {
          produtos.forEach(function (produto) {
            let divPrecoTotalCapsula = produto.querySelector(
              "span[class*='formattedPrice']",
            );
            let divPrecoCapsula = produto.querySelector(
              "footer div[class*='purchaseSection'] div[class*='capsuleAndSleeveLabelWrapper']",
            );
            if (divPrecoCapsula && divPrecoTotalCapsula) {
              produto.querySelector("footer").classList.add("primeAB");
              let precoSleeve = parsePrecoNumero(divPrecoTotalCapsula.innerText);
              let precoComDesconto = formatPrecoDesconto(
                precoSleeve - precoSleeve * 0.1,
              );

              let divPrime = document.createElement("div");
              divPrime.classList.add("_capsuleSleeveLabel_10cre_45");
              divPrime.classList.add("primeContainer");
              divPrime.innerHTML =
                "<span style='font-size: 14px;'> R$" +
                precoComDesconto +
                "</span>" +
                copy.plpSubscriptionSuffix;
              divPrime.addEventListener("click", function (e) {
                e.stopPropagation();
                window.location.href = copy.pedidoAutomaticoUrl;
              });
              divPrecoCapsula.append(divPrime);
            }
          });
        }
      } else if (regexPDPs.test(pagePathAtual)) {
        initPrimePdpVariantC();

        let conteudoCardCapsulas = document.querySelector(
          "nb-sku-coffee .cb-content, nb-plp-product-card .cn_card__content",
        );
        let divPreco = document.querySelector(
          "nb-plp-product-card .cn_card__priceWrapper, nb-sku-coffee .cb-shop",
        );
        let precoCaixaPDP = document.querySelector(
          "nb-sku-coffee .cb-price-current, nb-plp-product-card .cn_card__priceWrapper--current",
        );
        let buscaCardPDP = setInterval(function () {
          conteudoCardCapsulas = document.querySelector(
            "nb-sku-coffee .cb-content, nb-plp-product-card .cn_card__content",
          );
          divPreco = document.querySelector(
            "nb-plp-product-card .cn_card__priceWrapper, nb-sku-coffee .cb-shop",
          );
          precoCaixaPDP = document.querySelector(
            "nb-sku-coffee .cb-price-current, nb-plp-product-card .cn_card__priceWrapper--current",
          );

          if (conteudoCardCapsulas && precoCaixaPDP) {
            clearInterval(buscaCardPDP);

            if (conteudoCardCapsulas.querySelector(".primePDP")) {
              runVariantC();
              return;
            }

            let tagsCard = conteudoCardCapsulas.parentNode.querySelectorAll(
              "nb-card-labels span",
            );
            let isAbleToAdjustPDP = true;
            tagsCard.forEach(function (tag) {
              if (tag.innerText.toLowerCase() == copy.limitedEdition) {
                isAbleToAdjustPDP = false;
              }
            });
            if (isAbleToAdjustPDP) {
              let precoTexto =
                precoCaixaPDP.querySelector("span") || precoCaixaPDP;
              let precoNumerico = parsePrecoNumero(precoTexto.innerText);
              if (isNaN(precoNumerico)) {
                return;
              }
              let divPrimePDP = document.createElement("div");
              let sectionPrimePDP = document.createElement("section");
              let divDescontoPrime = document.createElement("div");
              let paragrafoApartirCapsulas = document.createElement("p");
              paragrafoApartirCapsulas.innerText = copy.footnoteCapsules;

              let precoComDesconto = formatPrecoDesconto(
                precoNumerico - precoNumerico * 0.1,
              );

              divPrimePDP.classList.add("primePDP");
              divDescontoPrime.classList.add("primeDescontoProdutoContainer");
              sectionPrimePDP.classList.add("beneficiosPrime");
              paragrafoApartirCapsulas.classList.add("observacaoPrime");

              divDescontoPrime.innerHTML =
                "<h3>" +
                copy.noSubscriptionHeading +
                '</h3><a href="' +
                copy.standingOrdersHref +
                '" title="' +
                copy.subscriptionTitle +
                '"><div class="descontoPDP"><p>' +
                copy.subscribeAndPay +
                '</p><h5><span class="precoCaixaPrime">R$ ' +
                precoComDesconto +
                "</span> <span> " +
                copy.perBoxWithSubscription +
                '</span></h5><span class="flagDescontoPDP">-10%</span></div></a>';
              divPrimePDP.append(divDescontoPrime);
              divPrimePDP.append(sectionPrimePDP);
              sectionPrimePDP.append(
                beneficioPrime(
                  '<nb-icon icon="24/symbol/promotions"></nb-icon>',
                  "10% OFF*",
                  "",
                ),
              );
              sectionPrimePDP.append(
                beneficioPrime(
                  '<nb-icon icon="32/delivery/free-delivery"></nb-icon>',
                  copy.freeShipping,
                  "",
                ),
              );
              sectionPrimePDP.append(
                beneficioPrime(
                  '<nb-icon icon="24/service/effortless-experience"></nb-icon>',
                  copy.zeroMonthlyFee,
                  "",
                ),
              );

              conteudoCardCapsulas.insertBefore(
                divPrimePDP,
                divPreco.nextSibling,
              );
              let botaoAssinaturaPrime = document.createElement("a");
              botaoAssinaturaPrime.setAttribute("href", copy.standingOrdersHref);
              botaoAssinaturaPrime.setAttribute("title", copy.subscriptionTitle);
              botaoAssinaturaPrime.classList.add("signUpPrime");
              botaoAssinaturaPrime.innerText = copy.ctaSubscribeNow;
              divPrimePDP.append(botaoAssinaturaPrime);
              divPrimePDP.append(paragrafoApartirCapsulas);
            }
            runVariantC();
          }
        }, 1000);

        function beneficioPrime(iconHTML, title, description) {
          let beneficioPrime = document.createElement("div");
          beneficioPrime.classList.add("containerBeneficioPrime");
          beneficioPrime.innerHTML =
            iconHTML + "<p>" + title + "</p><span>" + description + "</span>";
          return beneficioPrime;
        }
      }
    }

    function ajusteStringToNum(string) {
      return string.replace(/[^0-9.,]+/g, "");
    }

    function parsePrecoNumero(texto) {
      let numStr = ajusteStringToNum(texto);
      if (!numStr) return NaN;

      let temVirgula = numStr.indexOf(",") !== -1;
      let temPonto = numStr.indexOf(".") !== -1;

      if (temVirgula && temPonto) {
        if (numStr.lastIndexOf(",") > numStr.lastIndexOf(".")) {
          numStr = numStr.replace(/\./g, "").replace(",", ".");
        } else {
          numStr = numStr.replace(/,/g, "");
        }
      } else if (temVirgula) {
        numStr = numStr.replace(",", ".");
      }

      return parseFloat(numStr);
    }

    function formatPrecoDesconto(valor) {
      let preco = Number(valor);
      if (isNaN(preco)) return "";
      let formatado = preco.toFixed(2);
      if (isEnglish) {
        return formatado;
      }
      return formatado.replace(".", ",");
    }

    let css = `<style>
          @media screen and (max-width: 768px) {
            .primeContainer {
              font-size: 10px !important;
            }
            .descontoPDP {
              padding: 18px 4px !important;
              font-size: 14px !important;
            }
          }
    
        
          .primeAB span[class*='addToCart']{
            align-items:flex-start !important;
          }
          .primeContainer {
            font-weight: bold;
            font-size: 12px;
            background-color: rgb(153, 34, 26);
            color: #fff;
            padding: 4px;
            margin-top: 8px;
            margin-bottom: 4px;
            border-radius: 4px;
          }
          div.primePDP,
          div.primePDP * {
            font-family: "NespressoLucas", Helvetica, Arial, sans-serif;
          }
        
          div.primePDP {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin-top: 16px;
          }
          .primeDescontoProdutoContainer {
            width: 100%;
          }
          .primeDescontoProdutoContainer > h3 {
            font-size: 18px;
            display: none;
          }
          .descontoPDP {
            padding: 18px;
            display: flex;
            justify-content: space-evenly;
            font-size: 18px;
            background-color: #86724e;
            color: #fff;
            border-radius: 16px 16px 0px 0px;
            align-items: center;
            width: 100%;
          }
          span.flagDescontoPDP {
            background: #fff;
            color: #000;
            font-weight: 800;
            padding: 2px 4px;
            border-radius: 20px;
          }
          .descontoPDP > h5 {
            font-weight: 700;
          }
          .descontoPDP .precoCaixaPrime {
            font-size: 26px;
          }
          .descontoPDP span:not(.precoCaixaPrime) {
            font-size: 12px;
