<style>
  /* Espaçamentos globais do banner */
  .pb10 { padding-bottom: 2.5rem }
  .pt10 { padding-top: 2.5rem }

  .promo-codigos {
    display: flex;
    flex-direction: row;
    justify-content: space-between;
    align-items: flex-end;
    
    /* AJUSTE DE LARGURA PARA ALINHAMENTO FINO COM A IMAGEM */
    width: 95vw; 
    max-width: 1450px; 
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    
    /* Ajuste vertical para sobrepor exatamente a área do cupom na imagem */
    margin-top: 165px; 
    padding: 0 40px; 
    box-sizing: border-box;
    font-family: "NespressoLucas", Arial, sans-serif;
  }

  .codigo {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 15px; /* Espaço entre o cupom e o botão de copiar */
    width: 320px; 
  }

  /* Escondendo o texto original para não sobrepor o texto da imagem */
  .codigo p {
    visibility: hidden;
    height: 0;
    margin: 0;
  }

  .promo-codigo {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #961b2f; /* Fundo bordô conforme solicitado */
    font-weight: 700;
    padding: 6px 20px;
    border-radius: 30px;
    font-size: 1.4rem; /* Texto maior */
    color: #ffe8e0; /* Letras bege claro conforme solicitado */
    letter-spacing: 1px;
    width: 280px; /* Largura ajustada para bater com o elemento da imagem */
    text-align: center;
    box-sizing: border-box;
    border: 2px solid #8B1A2F; 
    text-transform: uppercase;
  }

  .promo-copy-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
    color: #8B1A2F;
    border: none;
    padding: 12px 20px;
    border-radius: 30px;
    cursor: pointer;
    font-size: 0.9rem;
    font-family: "NespressoLucas", Arial, sans-serif;
    font-weight: 700;
    width: 280px; /* Mesma largura do cupom para alinhar verticalmente */
    text-transform: uppercase;
    transition: all 0.2s;
    box-shadow: 0 4px 8px rgba(0,0,0,0.15);
  }

  .promo-copy-btn:hover { 
    background: #f8f8f8;
    transform: translateY(-2px);
    box-shadow: 0 6px 12px rgba(0,0,0,0.2);
  }
  
  .promo-copy-btn:disabled {
    background: #8B1A2F;
    color: #fff;
    cursor: default;
    transform: none;
  }

<script>
  function initPromoCopyButtonsSafe() {
    document.querySelectorAll(".promo-copy-btn").forEach(function(btn) {
      if (btn.dataset.listenerAttached === "true") return;
      btn.addEventListener("click", function() {
        var code = btn.getAttribute("data-code");
        var campaign = btn.getAttribute("data-campaign") || "flash_sale";
        
        const el = document.createElement('textarea');
        el.value = code;
        document.body.appendChild(el);
        el.select();
        document.execCommand('copy');
        document.body.removeChild(el);

        var original = btn.textContent;
        btn.textContent = "Copiado!";
        btn.disabled = true;
        
        setTimeout(function() {
          btn.textContent = original;
          btn.disabled = false;
        }, 2500);

        window.gtmDataObject = window.gtmDataObject || [];
        window.gtmDataObject.push({
          event: "local_event",
          local_event_category: campaign,
          local_event_action: "click",
          local_event_label: "promo_code_" + code
        });
      });
      btn.dataset.listenerAttached = "true";
    });
  }

  document.addEventListener("DOMContentLoaded", function() {
    new MutationObserver(function() {
      if (document.querySelectorAll(".promo-copy-btn").length > 0) {
        initPromoCopyButtonsSafe();
      }
    }).observe(document.body, { childList: true, subtree: true });
    initPromoCopyButtonsSafe();
  });
</script>
